[project]
name = "alphabet-sort-lmfn"
version = "0.1.0"
description = "verifiers' alphabet-sort as one lmfn function with several lmcc adapters"
requires-python = ">=3.11"
dependencies = ["verifiers", "datasets", "lmfn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphabet_sort_lmfn"]
