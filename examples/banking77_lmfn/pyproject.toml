[project]
name = "banking77-lmfn"
version = "0.1.0"
description = "Distill a thinking teacher into a small classifier: banking77 as one lmfn function"
requires-python = ">=3.11"
dependencies = ["verifiers", "datasets", "lmfn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["banking77_lmfn"]
